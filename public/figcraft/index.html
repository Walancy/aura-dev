            const inlineDesc = Object.getOwnPropertyDescriptor(ResizeObserverSize.prototype, 'inlineSize');

  <script>
    // Host bridge (Aura Dev): the parent posts {fc, method, params}; the reply is {fc, ok, body}.
    // During active pan, zoom, or pointer drag, return cached ui.inspect and debounce doc.dump
    // so synchronous WASM serialization never stalls interactive frames.
    let lastInspectOk = true;
    let lastInspectBody = null;
    let pendingDumpTimer = 0;
    let pendingDumpList = [];

    let syncTimer = 0;
    let syncTimerFollowup = 0;
    window.__fcUserInteracted = false;
    window.__fcLastShiftKey = false;

    function pushSelectionSync(delayMs) {
      if (syncTimer) clearTimeout(syncTimer);
      syncTimer = setTimeout(() => {
        syncTimer = 0;
        if (!window.figcraftCall) return;
        // a serializacao do documento e sincrona no wasm: durante zoom/pan/arraste espera o canvas assentar
        const idle = performance.now() - (window.__fcLastInputAt || 0);
        if (window.__fcPointerDown || idle < 250) {
          pushSelectionSync(250);
          return;
        }
        try {
          window.figcraftCall('document.inspect', JSON.stringify({ depth: 10 }), (ok, body) => {
            if (ok && body) {
              parent.postMessage(
                {
                  fcSelectionSync: body,
                  fcUserInteracted: Boolean(window.__fcUserInteracted),
                  fcShiftKey: Boolean(window.__fcLastShiftKey),
                },
                '*'
              );
            }
          });
        } catch (_) {}
      }, typeof delayMs === 'number' ? delayMs : 40);
    }

    function scheduleTwoPassSelectionSync() {
      pushSelectionSync(35);
      if (syncTimerFollowup) clearTimeout(syncTimerFollowup);
      syncTimerFollowup = setTimeout(() => {
        syncTimerFollowup = 0;
        pushSelectionSync(10);
      }, 130);
    }

    const ready = setInterval(() => {
      if (window.figcraftCall) {
        clearInterval(ready);
        try {
          window.figcraftCall('engine.execute', JSON.stringify({ command: 'select.set', params: { ids: [] } }), () => {});
        } catch (_) {}
        parent.postMessage({ fcReady: 1 }, '*');
        pushSelectionSync(500);
      }
    }, 80);

    window.addEventListener(
      'pointerdown',
      (e) => {
        window.__fcUserInteracted = true;
        window.__fcLastShiftKey = Boolean(e.shiftKey || e.metaKey || e.ctrlKey);
        parent.postMessage(
          {
            fcCanvasInput: {
              type: 'pointerdown',
              shiftKey: window.__fcLastShiftKey,
              ts: Date.now(),
            },
          },
          '*'
        );
      },
      { capture: true, passive: true }
    );

    window.addEventListener(
      'pointerup',
      (e) => {
        window.__fcUserInteracted = true;
        window.__fcLastShiftKey = Boolean(e.shiftKey || e.metaKey || e.ctrlKey);
        parent.postMessage(
          {
            fcCanvasInput: {
              type: 'pointerup',
              shiftKey: window.__fcLastShiftKey,
              ts: Date.now(),
            },
          },
          '*'
        );
        scheduleTwoPassSelectionSync();
      },
      { capture: true, passive: true }
    );

    window.addEventListener(
      'keyup',
      (e) => {
        window.__fcLastShiftKey = Boolean(e.shiftKey || e.metaKey || e.ctrlKey);
        scheduleTwoPassSelectionSync();
      },
      { passive: true }
    );

    let lastNativePasteTs = 0;

    function blobToPastedImage(blob, fallbackName) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = typeof reader.result === 'string' ? reader.result : '';
          if (!dataUrl) return resolve(null);
          const img = new Image();
          img.onload = () => {
            resolve({
              dataUrl,
              width: img.naturalWidth || img.width || 400,
              height: img.naturalHeight || img.height || 300,
              name: (blob && blob.name ? String(blob.name).replace(/\.[^.]+$/, '') : '') || fallbackName || 'Imagem colada',
            });
          };
          img.onerror = () => {
            resolve({
              dataUrl,
              width: 400,
              height: 300,
              name: fallbackName || 'Imagem colada',
            });
          };
          img.src = dataUrl;
        };
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(blob);
      });
    }

    window.addEventListener(
      'paste',
      async (e) => {
        const cd = e.clipboardData;
        if (!cd) return;
        const blobs = [];
        if (cd.items && cd.items.length) {
          for (let i = 0; i < cd.items.length; i++) {
            const it = cd.items[i];
            if (it && it.type && it.type.indexOf('image/') === 0) {
              const f = it.getAsFile();
              if (f) blobs.push(f);
            }
          }
        }
        if (!blobs.length && cd.files && cd.files.length) {
          for (let i = 0; i < cd.files.length; i++) {
            const f = cd.files[i];
            if (f && f.type && f.type.indexOf('image/') === 0) {
              blobs.push(f);
            }
          }
        }
        if (!blobs.length) return;
        lastNativePasteTs = Date.now();
        e.preventDefault();
        e.stopImmediatePropagation();
        window.__fcUserInteracted = true;
        const list = (await Promise.all(blobs.slice(0, 6).map((b, idx) => blobToPastedImage(b, idx > 0 ? `Imagem colada ${idx + 1}` : 'Imagem colada')))).filter(Boolean);
        if (list.length) {
          parent.postMessage({ fcPasteImages: list }, '*');
        }
      },
      { capture: true }
    );

    // copiar/recortar dentro do FigCraft: a area de transferencia pode ter um PNG da camada, mas quem cola e o proprio FigCraft
    window.__fcInternalCopy = false;
    window.addEventListener(
      'keydown',
      (e) => {
        const k = String(e.key || '').toLowerCase();

      { capture: true, passive: true }

    window.addEventListener('copy', () => { window.__fcInternalCopy = true; }, { capture: true, passive: true });
    window.addEventListener('cut', () => { window.__fcInternalCopy = true; }, { capture: true, passive: true });
    // voltou de outro app: o que esta na area de transferencia pode ser externo
    window.addEventListener('focus', () => { window.__fcInternalCopy = false; }, { passive: true });
    window.addEventListener('blur', () => { window.__fcInternalCopy = false; }, { passive: true });

    window.addEventListener(
      'keydown',
      (e) => {
        if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && String(e.key || '').toLowerCase() === 'v') {

            if (lastNativePasteTs >= ts0 - 30) return;
            if (!navigator.clipboard || typeof navigator.clipboard.read !== 'function') return;

              const clipItems = await navigator.clipboard.read();
              const blobs = [];

                }

              lastNativePasteTs = Date.now();
              window.__fcUserInteracted = true;
              const list = (await Promise.all(blobs.slice(0, 6).map((b, idx) => blobToPastedImage(b, idx > 0 ? `Imagem colada ${idx + 1}` : 'Imagem colada')))).filter(Boolean);

                parent.postMessage({ fcPasteImages: list, fcUndoInternalPaste: true }, '*');
              }
            } catch (_) {}
          }, 120);
        }
      },
      { capture: true, passive: true }
    );

    window.addEventListener(
      'dragover',
      (e) => {
        if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) {

        }

    window.addEventListener(
      'drop',
      async (e) => {
        const dt = e.dataTransfer;
        if (!dt || !dt.files || !dt.files.length) return;
        const blobs = [];

        e.preventDefault();
        e.stopImmediatePropagation();
        window.__fcUserInteracted = true;
        const list = (await Promise.all(blobs.slice(0, 6).map((b, idx) => blobToPastedImage(b, idx > 0 ? `Imagem ${idx + 1}` : 'Imagem')))).filter(Boolean);
        if (list.length) {
          parent.postMessage({ fcPasteImages: list }, '*');
        }
      },
      { capture: true }
    );

    function runBridgeCall(m, source) {
      if (!window.figcraftCall) return;
      window.figcraftCall(m.method, JSON.stringify(m.params || {}), (ok, body) => {
        if (m.method === 'ui.inspect' && ok && body) {
          lastInspectOk = ok;
          lastInspectBody = body;
        }
        if (m.method === 'doc.restore') {
          window.__fcUserInteracted = false;
          try {
            window.figcraftCall('engine.execute', JSON.stringify({ command: 'select.set', params: { ids: [] } }), () => {
              if (source) {
                source.postMessage({ fc: m.fc, ok, body }, '*');
              }
              pushSelectionSync(60);
            });
            return;
          } catch (_) {}
        }
        if (source) {
          source.postMessage({ fc: m.fc, ok, body }, '*');
        }
        if (m.method === 'engine.execute' && m.params?.command !== 'file.export') {
          pushSelectionSync(60);
        }
      });
    }

    function scheduleDeferredDump() {
      if (pendingDumpTimer) clearTimeout(pendingDumpTimer);
      pendingDumpTimer = setTimeout(() => {
        pendingDumpTimer = 0;
        const idleMs = performance.now() - (window.__fcLastInputAt || 0);
        if (window.__fcPointerDown || idleMs < 1600) {
          scheduleDeferredDump();
          return;
        }
        const list = pendingDumpList;
        pendingDumpList = [];
        if (!list.length || !window.figcraftCall) return;
        const last = list[list.length - 1];
        window.figcraftCall(last.m.method, JSON.stringify(last.m.params || {}), (ok, body) => {
          for (const item of list) {
            if (item.source) {
              item.source.postMessage({ fc: item.m.fc, ok, body }, '*');
            }
          }
        });
      }, 600);
    }

    addEventListener('message', (e) => {
      const m = e.data;
      if (!m || !m.fc || !window.figcraftCall) return;
      const idleMs = performance.now() - (window.__fcLastInputAt || 0);
      const isInteracting = Boolean(window.__fcPointerDown) || idleMs < 320;
      if (isInteracting && m.method === 'ui.inspect' && lastInspectBody !== null) {
        e.source.postMessage({ fc: m.fc, ok: lastInspectOk, body: lastInspectBody }, '*');
        return;
      }
      if ((window.__fcPointerDown || idleMs < 1600) && m.method === 'doc.dump') {
        pendingDumpList.push({ m, source: e.source });
        scheduleDeferredDump();
        return;
      }
      runBridgeCall(m, e.source);
    });
